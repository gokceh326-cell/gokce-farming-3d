name: Android APK Oluştur

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Projeyi indir
      - name: Projeyi GitHub'dan al
        uses: actions/checkout@v4

      # 2. Node.js 20
      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # 3. JAVA 21 - ÖNEMLİ
      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 4. Java sürümünü doğrula
      - name: Java 21 kontrol
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          javac -version

      # 5. Android SDK
      - name: Android SDK hazırla
        uses: android-actions/setup-android@v3

      # 6. Android SDK bileşenleri
      - name: Android SDK bileşenlerini kur
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 7. Web klasörünü hazırla
      - name: Web dosyalarını hazırla
        run: |
          mkdir -p www

          if [ -f index.html ]; then
            cp index.html www/index.html
          else
            echo "HATA: index.html bulunamadı!"
            exit 1
          fi

      # 8. package.json yoksa oluştur
      - name: NPM projesini kontrol et
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

      # 9. Capacitor ve TypeScript
      - name: Capacitor bağımlılıklarını kur
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install -D typescript

      # 10. Capacitor yapılandırması
      - name: Capacitor yapılandırmasını oluştur
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.gokce.farming3d',
            appName: 'Gökçe Farming 3D',
            webDir: 'www',
            bundledWebRuntime: false
          };

          export default config;
          EOF

      # 11. Android projesini oluştur
      - name: Android projesini oluştur
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android klasörü zaten mevcut."
          fi

      # 12. Web dosyalarını Android'e aktar
      - name: Web dosyalarını Android'e aktar
        run: |
          npx cap copy android

      # 13. Capacitor'u senkronize et
      - name: Capacitor'u senkronize et
        run: |
          npx cap sync android

      # 14. Uygulamayı yatay yap
      - name: Uygulamayı yatay yap
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()

          text = text.replace(
              'android:screenOrientation="unspecified"',
              'android:screenOrientation="landscape"'
          )

          if 'android:screenOrientation=' not in text:
              text = text.replace(
                  '<activity',
                  '<activity android:screenOrientation="landscape"',
                  1
              )

          p.write_text(text)
          PY

      # 15. Gradle'ın Java 21 kullanmasını zorla
      - name: Gradle Java 21 ayarla
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> android/gradle.properties

      # 16. Gradle sürümünü kontrol et
      - name: Gradle Java kontrol
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version

      # 17. APK oluştur
      - name: APK oluştur
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 18. APK'yı yükle
      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: Gokce-Farming-3D-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
