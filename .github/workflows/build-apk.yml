name: Farming 3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Farming 3D Android APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1 - PROJEYİ AL
      # --------------------------------------------------
      - name: Projeyi GitHub'dan al
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2 - NODE 22
      # ÖNEMLİ:
      # cache: npm YOK.
      # Böylece package-lock.json zorunluluğu yok.
      # --------------------------------------------------
      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Node sürümünü kontrol et
        run: |
          node --version
          npm --version

      # --------------------------------------------------
      # 3 - JAVA 21
      # Capacitor 7 için
      # --------------------------------------------------
      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Java sürümünü kontrol et
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      # --------------------------------------------------
      # 4 - ANDROID SDK
      # --------------------------------------------------
      - name: Android SDK hazırla
        uses: android-actions/setup-android@v3

      - name: Android SDK bileşenlerini kur
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      # --------------------------------------------------
      # 5 - WEB KLASÖRÜ
      # --------------------------------------------------
      - name: Web klasörünü hazırla
        shell: bash
        run: |
          mkdir -p www

          if [ -f index.html ]; then
            cp index.html www/index.html
          fi

          if [ -d assets ]; then
            cp -r assets www/
          fi

          if [ -d css ]; then
            cp -r css www/
          fi

          if [ -d js ]; then
            cp -r js www/
          fi

          if [ -d models ]; then
            cp -r models www/
          fi

          if [ -d textures ]; then
            cp -r textures www/
          fi

          if [ ! -f www/index.html ]; then
            echo "HATA: index.html bulunamadı."
            exit 1
          fi

          echo "Web dosyaları:"
          find www -maxdepth 3 -type f | sort

      # --------------------------------------------------
      # 6 - NPM PROJESİ
      # --------------------------------------------------
      - name: package.json hazırla
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            cat > package.json <<'EOF'
          {
            "name": "gokce-farming-3d",
            "version": "1.0.0",
            "private": true,
            "description": "Gokce Farming 3D",
            "scripts": {
              "build": "echo Web build hazır"
            },
            "dependencies": {
              "@capacitor/core": "7.6.8",
              "@capacitor/android": "7.6.8"
            },
            "devDependencies": {
              "@capacitor/cli": "7.6.8"
            }
          }
          EOF
          fi

          cat package.json

      # --------------------------------------------------
      # 7 - NPM BAĞIMLILIKLARI
      # npm ci DEĞİL
      # npm install kullanılıyor.
      # Böylece lock dosyası problemi yok.
      # --------------------------------------------------
      - name: NPM bağımlılıklarını kur
        run: |
          npm install --no-audit --no-fund

      # --------------------------------------------------
      # 8 - CAPACITOR CONFIG
      # --------------------------------------------------
      - name: Capacitor yapılandırmasını oluştur
        shell: bash
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.gokce.farming3d",
            "appName": "Gokce Farming 3D",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          cat capacitor.config.json

      # --------------------------------------------------
      # 9 - CAPACITOR ANDROID
      # --------------------------------------------------
      - name: Capacitor Android projesini oluştur
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      # --------------------------------------------------
      # 10 - WEB DOSYALARINI ANDROID'E AKTAR
      # --------------------------------------------------
      - name: Web dosyalarını Android'e aktar
        run: |
          npx cap copy android

      # --------------------------------------------------
      # 11 - CAPACITOR SENKRONİZASYONU
      # --------------------------------------------------
      - name: Capacitor'u senkronize et
        run: |
          npx cap sync android

      # --------------------------------------------------
      # 12 - UYGULAMAYI YATAY YAP
      # --------------------------------------------------
      - name: Uygulamayı yatay yap
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()

          if 'android:screenOrientation="landscape"' not in text:
              text = text.replace(
                  'android:exported="true"',
                  'android:exported="true"\n            android:screenOrientation="landscape"'
              )

          p.write_text(text)
          PY

          echo "Landscape ayarı:"
          grep -n "screenOrientation" "$MANIFEST" || true

      # --------------------------------------------------
      # 13 - GRADLE JAVA 21 KONTROLÜ
      # --------------------------------------------------
      - name: Gradle Java sürümünü kontrol et
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version

      # --------------------------------------------------
      # 14 - APK OLUŞTUR
      # --------------------------------------------------
      - name: APK oluştur
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # --------------------------------------------------
      # 15 - APK'YI YÜKLE
      # --------------------------------------------------
      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: Gokce-Farming-3D-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
