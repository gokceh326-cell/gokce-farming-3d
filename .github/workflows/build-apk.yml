name: Gökçe Farming 3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Android APK Oluştur
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK hazırla
        uses: android-actions/setup-android@v3

      - name: Android SDK bileşenlerini kur
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Web klasörünü hazırla
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: package.json oluştur
        run: |
          cat > package.json <<'EOF'
          {
            "name": "gokce-farming-3d",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo Web uygulaması hazır"
            },
            "dependencies": {
              "@capacitor/core": "7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "7.4.3",
              "@capacitor/android": "7.4.3"
            }
          }
          EOF

      - name: NPM bağımlılıklarını kur
        run: npm install

      - name: Capacitor yapılandırmasını oluştur
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.gokce.farming3d',
            appName: 'Gökçe Farming 3D',
            webDir: 'www',
            bundledWebRuntime: false
          };

          export default config;
          EOF

      - name: Android projesini oluştur
        run: npx cap add android

      - name: Web dosyalarını Android'e aktar
        run: npx cap copy android

      - name: Capacitor'u senkronize et
        run: npx cap sync android

      - name: Uygulamayı yatay yap
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          text = text.replace(
              'android:screenOrientation="portrait"',
              'android:screenOrientation="landscape"'
          )

          if 'android:screenOrientation=' not in text:
              text = text.replace(
                  '<activity',
                  '<activity android:screenOrientation="landscape"',
                  1
              )

          manifest.write_text(text)
          PY

      - name: APK oluştur
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: gokce-farming-3d-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
