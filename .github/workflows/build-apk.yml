name: Gökçe Farming 3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: APK Oluştur
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android araçlarını hazırla
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: NPM projesini hazırla
        run: |
          npm init -y
          npm install @capacitor/core@7.4.3
          npm install --save-dev @capacitor/cli@7.4.3 @capacitor/android@7.4.3

      - name: Capacitor'u başlat
        run: |
          npx cap init "Gökçe Farming 3D" "com.gokce.farming3d" --web-dir .

      - name: Android projesini oluştur
        run: |
          npx cap add android
          npx cap sync android

      - name: Uygulamayı yatay yap
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          s = s.replace(
              '<activity',
              '<activity android:screenOrientation="landscape"',
              1
          )

          p.write_text(s)
          PY

      - name: APK oluştur
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: gokce-farming-3d-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
