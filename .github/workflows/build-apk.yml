name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Projeyi GitHub'dan al
        uses: actions/checkout@v4

      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Java sürümünü kontrol et
        run: |
          java -version
          javac -version
          node --version
          npm --version

      - name: Web klasörünü hazırla
        run: |
          rm -rf www
          mkdir -p www

          if [ -f index.html ]; then
            cp index.html www/index.html
          elif [ -f ./web/index.html ]; then
            cp ./web/index.html www/index.html
          else
            echo "index.html bulunamadı!"
            exit 1
          fi

      - name: package.json oluştur
        run: |
          cat > package.json <<'EOF'
          {
            "name": "gokce-farming-3d",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo Web build hazir"
            },
            "dependencies": {
              "@capacitor/core": "^8.0.0",
              "@capacitor/android": "^8.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^8.0.0",
              "typescript": "^5.9.0"
            }
          }
          EOF

      - name: NPM bağımlılıklarını kur
        run: npm install

      - name: Capacitor yapılandırmasını oluştur
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.gokcehucres.farming3d',
            appName: 'Gokce Farming 3D',
            webDir: 'www',
            bundledWebRuntime: false
          };

          export default config;
          EOF

      - name: Capacitor Android projesini oluştur
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android klasörü zaten mevcut."
          fi

      - name: Web dosyalarını Android'e aktar
        run: npx cap copy android

      - name: Capacitor'u senkronize et
        run: npx cap sync android

      - name: Gradle Java 21 ayarla
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> android/gradle.properties

      - name: Android projesini kontrol et
        working-directory: android
        run: ./gradlew --version

      - name: APK oluştur
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: Gokce-Farming-3D-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
