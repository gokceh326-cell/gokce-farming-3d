name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: APK oluştur
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi al
        uses: actions/checkout@v4

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK hazırla
        uses: android-actions/setup-android@v3

      - name: Android SDK bileşenlerini kur
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: package.json oluştur
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

      - name: Capacitor kur
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Web klasörünü hazırla
        run: |
          rm -rf www
          mkdir -p www

          if [ -f index.html ]; then
            cp index.html www/index.html
          else
            echo "HATA: index.html bulunamadı!"
            exit 1
          fi

      - name: Capacitor yapılandırmasını oluştur
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.gokce.farming3d",
            "appName": "Gökçe Farming 3D",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Android projesini oluştur
        run: |
          rm -rf android
          npx cap add android

      - name: Web dosyalarını Android'e aktar
        run: |
          npx cap copy android

      - name: Capacitor'u senkronize et
        run: |
          npx cap sync android

      - name: Uygulamayı yatay yap
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()

          text = text.replace(
              '<activity android:name=".MainActivity"',
              '<activity android:name=".MainActivity" android:screenOrientation="landscape"'
          )

          p.write_text(text)
          PY

      - name: Java sürümünü kontrol et
        run: |
          java -version
          javac -version

      - name: APK oluştur
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: gokce-farming-3d-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
